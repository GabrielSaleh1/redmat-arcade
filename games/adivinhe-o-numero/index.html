<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Adivinhe o Número — Demonstração</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#177656,#063527 65%);color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:20px}main{width:min(520px,100%);padding:28px;border:2px solid #2ff8b1;border-radius:24px;background:#072a27;box-shadow:0 15px 50px #020b15;text-align:center}h1{font-size:clamp(2rem,6vw,3rem);margin:0 0 6px;color:#ffe25a}p{line-height:1.6;color:#d3f7ea}.mark{background:#ffdb51;border-radius:30px;padding:6px 12px;color:#102d23;font-size:.75rem;font-weight:900;display:inline-block;margin-bottom:14px}input{width:140px;background:#fff;color:#143c35;border:0;border-radius:10px;font:800 2rem system-ui;text-align:center;padding:12px}button{border:0;border-radius:10px;background:#ffdf49;color:#0d312d;font:900 1rem system-ui;padding:17px;cursor:pointer;margin:10px 5px}.secondary{background:#1f6652;color:white;border:1px solid #40daa7}#feedback{padding:15px;border-radius:12px;background:#114f43;min-height:54px;font-weight:800}#tries{font-size:.9rem;color:#aff9dc}</style></head><body><main><span class="mark">ATIVIDADE DEMONSTRATIVA DO LOBBY</span><h1>ADIVINHE O NÚMERO</h1><p>O Matinho pensou em um número inteiro de <b>1 a 100</b>. Descubra-o usando pistas de maior ou menor!</p><form id="form"><input id="guess" type="number" min="1" max="100" required aria-label="Seu palpite"><button type="submit">TESTAR</button></form><div id="feedback" aria-live="polite">Faça seu primeiro palpite.</div><p id="tries">Tentativas: 0</p><button id="reset" class="secondary" type="button">NOVO NÚMERO</button><p><small>Este minijogo é apenas uma demonstração da integração.<br>O jogo original do REDMAT pode substituí-lo depois.</small></p></main><script>let number=Math.floor(Math.random()*100)+1,tries=0;const form=document.querySelector('#form'),guess=document.querySelector('#guess'),feedback=document.querySelector('#feedback'),count=document.querySelector('#tries');form.addEventListener('submit',e=>{e.preventDefault();const n=Number(guess.value);if(n<1||n>100)return;tries++;feedback.textContent=n===number?'Você acertou! O número era '+number+'.':n<number?'O número é MAIOR que '+n+'.':'O número é MENOR que '+n+'.';count.textContent='Tentativas: '+tries;if(n===number){guess.disabled=true;form.querySelector('button').disabled=true}else{guess.select()}});document.querySelector('#reset').onclick=()=>{number=Math.floor(Math.random()*100)+1;tries=0;feedback.textContent='Faça seu primeiro palpite.';count.textContent='Tentativas: 0';guess.disabled=false;form.querySelector('button').disabled=false;guess.value='';guess.focus()};</script></body></html>
